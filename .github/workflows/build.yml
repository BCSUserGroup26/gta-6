name: Build GTA6 BJB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artwork:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get native tools
        run: |
          git clone https://github.com/blackbearreloaded/ps5-native-app-boilerplate.git native-app
          git -C native-app checkout 3ada439fa044f60c8b488678577a740761385711
      - name: Prepare artwork
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/microsoft/DirectXTex/releases/download/may2026/texconv.exe -OutFile texconv.exe
          if ((Get-FileHash texconv.exe -Algorithm SHA256).Hash.ToLower() -ne "dcfdec10244e02cf5037fba089c55fb7e1326b1c8181742d77d15fa5cb5eef06") { throw "Artwork tool checksum mismatch" }
          ./native-app/tools/prepare-assets.ps1 -Texconv ./texconv.exe -Icon media/logo.png -SelectionBackground media/background.jpg -LaunchBackground media/loading_bg.jpg -OutputDirectory converted-art
      - uses: actions/upload-artifact@v4
        with:
          name: artwork
          path: converted-art/
  build:
    needs: artwork
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: artwork
          path: converted-art
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 ninja-build ffmpeg python3-pil fonts-dejavu-core g++
      - name: Get native template
        run: |
          git clone https://github.com/blackbearreloaded/ps5-native-app-boilerplate.git native-app
          git -C native-app checkout 3ada439fa044f60c8b488678577a740761385711
      - name: Prepare application
        run: |
          python3 prepare.py native-app
          cp converted-art/pic*.dds native-app/sce_sys/
      - name: Verify media and audio configuration
        run: |
          g++ -std=c++20 -O1 -fsanitize=address,undefined tests/video_check.cpp -o video-check
          ./video-check native-app/assets/loading.m1v native-app/assets/loop.m1v native-app/assets/rickroll.m1v
          g++ -std=c++20 -O1 -fsanitize=address,undefined -ffunction-sections -fdata-sections tests/audio_check.cpp -Wl,--gc-sections -o audio-check
          ./audio-check
      - name: Build application
        working-directory: native-app
        run: make app BUILD_JOBS=2 USE_CCACHE=0
      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-BJB-PPSA99991
          path: native-app/dist/PPSA*.zip
          if-no-files-found: error
          compression-level: 0
